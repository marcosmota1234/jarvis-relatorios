<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>Melhores lugares no Rio de Janeiro</title>
<style>
:root{--bg:#05080d;--card:#0c121b;--line:#16212e;--cy:#00e5ff;--tx:#e6f3f7;--mut:#8aa0ab}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
header{padding:32px 18px 18px;text-align:center;background:radial-gradient(ellipse at top,#08323a 0%,transparent 70%)}
h1{font-size:1.7rem;color:var(--cy);text-shadow:0 0 18px rgba(0,229,255,.45);line-height:1.2}
header p{color:var(--mut);margin-top:8px;font-size:.95rem}
.bar{position:sticky;top:0;z-index:5;background:rgba(5,8,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
#q{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:1rem;outline:none}
#q:focus{border-color:var(--cy);box-shadow:0 0 0 2px rgba(0,229,255,.2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:.85rem;cursor:pointer}
.chip.on{background:var(--cy);color:#001418;border-color:var(--cy);font-weight:600}
main{padding:14px;display:grid;gap:12px;max-width:900px;margin:auto}
@media(min-width:700px){main{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;transition:border-color .2s}
.card:hover{border-color:var(--cy)}
.top{display:flex;gap:12px;align-items:center}
.ico{font-size:1.8rem;width:48px;height:48px;display:grid;place-items:center;background:#0a1d25;border-radius:12px;flex:none}
.card h2{font-size:1.1rem}
.tag{font-size:.72rem;color:var(--cy);text-transform:uppercase;letter-spacing:.08em}
.card p{color:var(--mut);font-size:.92rem;margin-top:10px}
.tip{margin-top:10px;font-size:.85rem;padding:8px 10px;border-left:3px solid var(--cy);background:#08141a;border-radius:0 8px 8px 0}
.map{display:inline-block;margin-top:12px;color:var(--cy);font-size:.88rem;text-decoration:none}
#empty{display:none;text-align:center;color:var(--mut);padding:30px}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:24px 16px 32px}
</style>
</head>
<body>
<header>
<h1>🌴 Rio de Janeiro<br>Melhores lugares</h1>
<p>Praias, miradouros, cultura e gastronomia da Cidade Maravilhosa</p>
</header>
<div class="bar">
<input id="q" type="search" placeholder="Pesquisar lugares…" aria-label="Pesquisar">
<div class="chips" id="chips"></div>
</div>
<main id="list"></main>
<div id="empty">Nenhum lugar encontrado.</div>
<footer>Confirma horários e preços antes de visitar. Mantém atenção à segurança, sobretudo à noite.</footer>
<script>
const places=[
{n:"Cristo Redentor",c:"Miradouros",i:"✝️",d:"Ícone do Rio no topo do Corcovado, com vista de 360° sobre a cidade, a baía e a Lagoa.",t:"Vai cedo ou ao fim da tarde para evitar nuvens e filas. Sobe de comboio ou van oficial.",q:"Cristo Redentor Rio de Janeiro"},
{n:"Pão de Açúcar",c:"Miradouros",i:"🚡",d:"Dois teleféricos até ao morro da Urca; um dos melhores pores do sol do mundo.",t:"Chega 1h antes do pôr do sol e compra bilhete online.",q:"Pão de Açúcar Rio de Janeiro"},
{n:"Praia de Ipanema",c:"Praias",i:"🏖️",d:"Areia animada, estilo descontraído e o famoso pôr do sol junto à Pedra do Arpoador.",t:"Posto 9 é o ponto de encontro mais cool.",q:"Praia de Ipanema"},
{n:"Praia de Copacabana",c:"Praias",i:"🌊",d:"Passeio em calçadão icónico com 4 km de praia, quiosques e vida noturna.",t:"Prova água de coco e caminha no calçadão ao nascer do sol.",q:"Praia de Copacabana"},
{n:"Arpoador",c:"Miradouros",i:"🌅",d:"Rochedo entre Ipanema e Copacabana onde se aplaude o pôr do sol todos os dias.",t:"Leva casaco leve e chega cedo para um bom lugar.",q:"Pedra do Arpoador"},
{n:"Escadaria Selarón",c:"Cultura",i:"🎨",d:"Escadaria coberta de azulejos coloridos de todo o mundo, entre Lapa e Santa Teresa.",t:"Visita de manhã, com menos gente.",q:"Escadaria Selarón"},
{n:"Santa Teresa",c:"Cultura",i:"🚋",d:"Bairro boémio com ateliers, ruas de pedra, bares e vistas sobre o centro.",t:"Explora a pé e pára nos cafés com vista.",q:"Santa Teresa Rio de Janeiro"},
{n:"Jardim Botânico",c:"Natureza",i:"🌿",d:"Jardim com palmeiras imperiais, orquídeas e sombra perfeita ao pé do Corcovado.",t:"Combina com o Parque Lage, ali perto.",q:"Jardim Botânico do Rio de Janeiro"},
{n:"Parque Lage",c:"Natureza",i:"🏛️",d:"Palacete numa floresta tropical, com café no pátio interior e trilhos para o Corcovado.",t:"Entrada gratuita; ótimo para fotos.",q:"Parque Lage"},
{n:"Floresta da Tijuca",c:"Natureza",i:"🦜",d:"Maior floresta urbana do mundo, com cascatas, trilhos e miradouros.",t:"Leva água e calçado fechado.",q:"Parque Nacional da Tijuca"},
{n:"Pedra do Telescópio / Pedra da Gávea",c:"Natureza",i:"🥾",d:"Trilhos para quem gosta de aventura, com vistas espetaculares sobre a Barra e São Conrado.",t:"Faz trilhos mais exigentes com guia.",q:"Pedra da Gávea"},
{n:"Lapa e Arcos da Lapa",c:"Cultura",i:"🎶",d:"Coração da vida noturna, com samba, choro e bares históricos sob o aqueduto.",t:"Sexta e sábado são os melhores dias.",q:"Arcos da Lapa"},
{n:"Museu do Amanhã e Praça Mauá",c:"Cultura",i:"🔭",d:"Arquitetura futurista de Calatrava na renovada zona portuária, junto ao Museu de Arte do Rio.",t:"Às terças a entrada costuma ser gratuita para algumas pessoas.",q:"Museu do Amanhã"},
{n:"Maracanã",c:"Cultura",i:"⚽",d:"Estádio lendário do futebol brasileiro. Assiste a um jogo do Flamengo ou Fluminense.",t:"Compra bilhetes por canais oficiais.",q:"Estádio do Maracanã"},
{n:"Confeitaria Colombo",c:"Comida",i:"☕",d:"Café belle époque de 1894 no centro, com espelhos e vitrais.",t:"Pede os doces e o chá da tarde.",q:"Confeitaria Colombo Rio de Janeiro"},
{n:"Churrascaria rodízio",c:"Comida",i:"🥩",d:"Experiência clássica brasileira com cortes servidos à mesa.",t:"Vai com fome e guarda espaço para a sobremesa.",q:"churrascaria rodízio Rio de Janeiro"},
{n:"Feira de São Cristóvão",c:"Comida",i:"🍲",d:"Centro de tradições nordestinas com comida, forró e artesanato.",t:"Aos fins de semana está mais animada.",q:"Feira de São Cristóvão"},
{n:"Ilha de Paquetá",c:"Natureza",i:"⛴️",d:"Ilha tranquila na baía de Guanabara, sem carros, para passear de bicicleta.",t:"Vai de barca a partir da Praça XV.",q:"Ilha de Paquetá"},
{n:"Prainha e Grumari",c:"Praias",i:"🏄",d:"Praias selvagens e menos movimentadas, ideais para surf e sossego.",t:"Vão cheias aos fins de semana; vai durante a semana.",q:"Praia do Grumari"},
{n:"Lagoa Rodrigo de Freitas",c:"Natureza",i:"🚲",d:"Ciclovia e pedalinhos com o Corcovado como pano de fundo.",t:"Ótimo ao fim da tarde e nas feiras de comida.",q:"Lagoa Rodrigo de Freitas"}
];
const cats=["Todos",...new Set(places.map(p=>p.c))];
let cat="Todos";
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function chips(){
  $("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const r=places.filter(p=>(cat==="Todos"||p.c===cat)&&(p.n+p.d+p.c).toLowerCase().includes(q));
  $("list").innerHTML=r.map(p=>`<article class="card"><div class="top"><div class="ico">${p.i}</div><div><div class="tag">${esc(p.c)}</div><h2>${esc(p.n)}</h2></div></div><p>${esc(p.d)}</p><div class="tip">💡 ${esc(p.t)}</div><a class="map" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/${encodeURIComponent(p.q)}">📍 Ver no mapa →</a></article>`).join("");
  $("empty").style.display=r.length?"none":"block";
}
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  cat=b.dataset.c;chips();render();
});
$("q").addEventListener("input",render);
chips();render();
</script>
</body>
</html>
